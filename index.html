<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Runner</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
        }

        textarea {
            width: 100%;
            height: 350px;
            resize: vertical;
            padding: 15px;
            font-family: Consolas, monospace;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #1e1e1e;
            color: #ffffff;
            outline: none;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
        }

        #output {
            margin-top: 10px;
            background: #111;
            color: #00ff66;
            padding: 15px;
            min-height: 120px;
            white-space: pre-wrap;
            border-radius: 8px;
            font-family: Consolas, monospace;
            overflow-x: auto;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Python Runner</h1>

    <p>Enter or paste Python code:</p>

    <textarea id="pythonCode">import math

x = 25

print(f"The square root of {x} is {math.sqrt(x)}")</textarea>

    <br>

    <button onclick="sendPythonCode()">
        Send to App
    </button>

    <div id="status"></div>

    <h3>Output</h3>

    <div id="output"></div>

</div>


<script>

function sendPythonCode() {

    const codeBox = document.getElementById("pythonCode");
    const outputBox = document.getElementById("output");
    const statusBox = document.getElementById("status");

    const code = codeBox.value;

    // Check if code is empty
    if (!code.trim()) {
        alert("Please enter Python code.");
        return;
    }

    // Check whether Android interface exists
    if (
        typeof Android === "undefined" ||
        typeof Android.runPythonCode !== "function"
    ) {

        statusBox.textContent =
            "Android Python interface is not available.";

        outputBox.textContent =
            "Open this website inside your Android app WebView.";

        return;
    }

    statusBox.textContent = "Sending Python code to app...";
    outputBox.textContent = "";

    try {

        // Send the user's Python code to Android
        const result = Android.runPythonCode(code);

        // Display result received from Android
        outputBox.textContent = String(result);

        statusBox.textContent = "Python execution completed.";

    } catch (error) {

        statusBox.textContent = "Error";

        outputBox.textContent =
            error.message || String(error);
    }
}

</script>

</body>
</html>
