<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Python Runner</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 24px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 25px;
    }

    .label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 300px;
      padding: 16px;
      box-sizing: border-box;

      border-radius: 12px;
      border: 1px solid #334155;

      background: #111827;
      color: #e2e8f0;

      font-family: Consolas, monospace;
      font-size: 16px;

      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #2563eb;
    }

    button {
      margin-top: 16px;
      padding: 12px 24px;

      border: none;
      border-radius: 8px;

      background: #2563eb;
      color: white;

      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    .status {
      margin-top: 15px;
      color: #94a3b8;
    }

    .bridge-status {
      margin-top: 10px;
      padding: 10px;

      border-radius: 8px;

      background: #1e293b;
      color: #94a3b8;

      font-size: 14px;
    }

    .output-title {
      margin-top: 25px;
    }

    .output-box {
      margin-top: 10px;

      background: #111827;

      border: 1px solid #334155;

      border-radius: 12px;

      padding: 16px;

      white-space: pre-wrap;
      word-break: break-word;

      min-height: 120px;

      color: #d1fae5;

      font-family: Consolas, monospace;
      font-size: 15px;
    }
  </style>

</head>


<body>

  <div class="container">

    <h1>Python Runner</h1>


    <label class="label" for="code">
      Paste Python code
    </label>


    <textarea id="code">print("Hello from Python!")

x = 2 + 3

print("Result:", x)

__result__ = x</textarea>


    <button id="runBtn">
      Send to App
    </button>


    <div id="status" class="status">
      Ready
    </div>


    <div id="bridgeStatus" class="bridge-status">
      Checking Android Python bridge...
    </div>


    <h3 class="output-title">
      Output
    </h3>


    <div id="output" class="output-box">
Waiting for result...
    </div>

  </div>


  <script>

    // ==================================================
    // ELEMENTS
    // ==================================================

    const runBtn =
      document.getElementById("runBtn");

    const codeInput =
      document.getElementById("code");

    const outputBox =
      document.getElementById("output");

    const statusBox =
      document.getElementById("status");

    const bridgeStatus =
      document.getElementById("bridgeStatus");


    // ==================================================
    // CHECK PYTHON BRIDGE
    //
    // Supports BOTH:
    //
    // 1. AndroidPythonBridge.execute()
    //
    // 2. AndroidPython.execute()
    // ==================================================

    function isPythonBridgeAvailable() {

      return (

        (
          window.AndroidPythonBridge &&
          typeof window.AndroidPythonBridge.execute === "function"
        )

        ||

        (
          window.AndroidPython &&
          typeof window.AndroidPython.execute === "function"
        )

      );

    }


    // ==================================================
    // FIND WHICH BRIDGE IS AVAILABLE
    // ==================================================

    function getPythonBridge() {

      // Preferred bridge

      if (
        window.AndroidPythonBridge &&
        typeof window.AndroidPythonBridge.execute === "function"
      ) {

        return {
          type: "proxy",
          bridge: window.AndroidPythonBridge
        };

      }


      // Fallback raw interface

      if (
        window.AndroidPython &&
        typeof window.AndroidPython.execute === "function"
      ) {

        return {
          type: "raw",
          bridge: window.AndroidPython
        };

      }


      return null;

    }


    // ==================================================
    // UPDATE BRIDGE STATUS
    // ==================================================

    function updateBridgeStatus() {

      const bridge =
        getPythonBridge();


      if (!bridge) {

        bridgeStatus.textContent =
          "Android Python bridge not found. Open this page inside your Android app.";

        return;

      }


      if (bridge.type === "proxy") {

        bridgeStatus.textContent =
          "Android Python bridge connected (proxy interface).";

      }

      else if (bridge.type === "raw") {

        bridgeStatus.textContent =
          "Android Python bridge connected (raw interface).";

      }

    }


    // ==================================================
    // EXECUTE PYTHON
    //
    // IMPORTANT:
    //
    // This function supports:
    //
    // AndroidPythonBridge.execute(code)
    //
    // AND
    //
    // AndroidPython.execute(code)
    //
    // ==================================================

    function execPython(
      code,
      { timeoutMs = 8000 } = {}
    ) {

      return new Promise((resolve) => {

        let done = false;


        // ----------------------------------------------
        // FINISH ONLY ONCE
        // ----------------------------------------------

        const finish = (result) => {

          if (done) {
            return;
          }

          done = true;

          resolve(result);

        };


        // ----------------------------------------------
        // FIND AVAILABLE BRIDGE
        // ----------------------------------------------

        const bridgeInfo =
          getPythonBridge();


        if (!bridgeInfo) {

          finish({

            ok: false,

            output: "",

            value: null,

            error: "no-bridge",

            traceback: ""

          });

          return;

        }


        // ----------------------------------------------
        // CALL ANDROID
        // ----------------------------------------------

        try {

          let raw;


          // ============================================
          // PREFERRED:
          // AndroidPythonBridge.execute(code)
          // ============================================

          if (bridgeInfo.type === "proxy") {

            raw =
              bridgeInfo.bridge.execute(
                String(code)
              );

          }


          // ============================================
          // FALLBACK:
          // AndroidPython.execute(code)
          //
          // This normally returns JSON STRING
          // ============================================

          else {

            raw =
              bridgeInfo.bridge.execute(
                String(code)
              );

          }


          // ----------------------------------------------
          // PROCESS RETURN VALUE
          // ----------------------------------------------

          let result = raw;


          // AndroidPython.execute()
          // may return a JSON string.

          if (typeof raw === "string") {

            try {

              result =
                JSON.parse(raw);

            }

            catch (jsonError) {

              // If the returned string is not JSON,
              // treat it as normal Python output.

              result = {

                ok: true,

                output: raw,

                value: null,

                error: "",

                traceback: ""

              };

            }

          }


          // ----------------------------------------------
          // EMPTY RESPONSE
          // ----------------------------------------------

          if (
            result === null ||
            result === undefined
          ) {

            result = {

              ok: false,

              output: "",

              value: null,

              error: "empty-response",

              traceback: ""

            };

          }


          // ----------------------------------------------
          // RETURN RESULT
          // ----------------------------------------------

          finish(result);

        }


        catch (error) {

          finish({

            ok: false,

            output: "",

            value: null,

            error: String(error),

            traceback: ""

          });

        }


        // =================================================
        // TIMEOUT
        //
        // IMPORTANT:
        //
        // This timeout cannot cancel a synchronous
        // Android addJavascriptInterface() call.
        //
        // If execute() is currently blocking the WebView,
        // JavaScript itself cannot continue until that
        // native call returns.
        //
        // For long-running Python code, use an async
        // Android bridge such as executeAsync().
        // =================================================

        setTimeout(() => {

          finish({

            ok: false,

            output: "",

            value: null,

            error: "timeout",

            traceback:
              "Python execution exceeded " +
              timeoutMs +
              " ms. " +
              "This timeout does not cancel a blocking native call."

          });

        }, timeoutMs);

      });

    }


    // ==================================================
    // RUN PYTHON CODE
    // ==================================================

    async function runCode() {

      const pythonCode =
        codeInput.value;


      // ----------------------------------------------
      // EMPTY CODE
      // ----------------------------------------------

      if (!pythonCode.trim()) {

        outputBox.textContent =
          "Please enter Python code.";

        statusBox.textContent =
          "No Python code entered.";

        return;

      }


      // ----------------------------------------------
      // CHECK BRIDGE
      // ----------------------------------------------

      if (!isPythonBridgeAvailable()) {

        outputBox.textContent =
          "Android Python bridge not found.\n\n" +

          "The Android app must expose either:\n\n" +

          "AndroidPythonBridge.execute(code)\n\n" +

          "or:\n\n" +

          "AndroidPython.execute(code)";

        statusBox.textContent =
          "Bridge not connected.";

        updateBridgeStatus();

        return;

      }


      // ----------------------------------------------
      // UPDATE UI
      // ----------------------------------------------

      runBtn.disabled = true;


      outputBox.textContent =
        "Running Python...";


      statusBox.textContent =
        "Sending Python code to Android app...";


      try {

        // --------------------------------------------
        // EXECUTE PYTHON
        // --------------------------------------------

        const result =
          await execPython(

            pythonCode,

            {
              timeoutMs: 8000
            }

          );


        console.log(
          "Python result:",
          result
        );


        // --------------------------------------------
        // SUCCESS
        // --------------------------------------------

        if (result.ok === true) {

          let displayText = "";


          // ==========================================
          // PRINT OUTPUT
          // ==========================================

          if (

            result.output !== null &&

            result.output !== undefined &&

            String(result.output) !== ""

          ) {

            displayText +=
              String(result.output);

          }


          // ==========================================
          // __result__
          // ==========================================

          if (

            result.value !== null &&

            result.value !== undefined

          ) {

            if (displayText !== "") {

              displayText +=
                "\n\n";

            }


            displayText +=
              "Result: " +
              formatPythonValue(result.value);

          }


          // ==========================================
          // NOTHING RETURNED
          // ==========================================

          if (displayText === "") {

            displayText =
              "Python finished successfully with no output.";

          }


          outputBox.textContent =
            displayText;


          statusBox.textContent =
            "Python execution completed.";

        }


        // --------------------------------------------
        // ERROR
        // --------------------------------------------

        else {

          let errorText =
            "Python execution failed.";


          if (result.error) {

            errorText +=
              "\n\nError:\n" +
              String(result.error);

          }


          if (result.traceback) {

            errorText +=
              "\n\nTraceback:\n" +
              String(result.traceback);

          }


          if (result.output) {

            errorText +=
              "\n\nOutput before error:\n" +
              String(result.output);

          }


          outputBox.textContent =
            errorText;


          statusBox.textContent =
            "Python execution failed.";

        }

      }


      catch (error) {

        console.error(
          "Python execution error:",
          error
        );


        outputBox.textContent =
          "JavaScript / Android Bridge Error:\n\n" +
          String(error);


        statusBox.textContent =
          "Failed to execute Python.";

      }


      // ----------------------------------------------
      // ENABLE BUTTON
      // ----------------------------------------------

      runBtn.disabled = false;

    }


    // ==================================================
    // FORMAT RESULT
    // ==================================================

    function formatPythonValue(value) {

      if (typeof value === "object") {

        try {

          return JSON.stringify(
            value,
            null,
            2
          );

        }

        catch (error) {

          return String(value);

        }

      }


      return String(value);

    }


    // ==================================================
    // BUTTON
    // ==================================================

    runBtn.addEventListener(
      "click",
      runCode
    );


    // ==================================================
    // INITIAL BRIDGE CHECK
    // ==================================================

    updateBridgeStatus();


    // Android bridge may become available shortly
    // after the WebView loads.

    setTimeout(
      updateBridgeStatus,
      500
    );


    setTimeout(
      updateBridgeStatus,
      1500
    );


  </script>

</body>

</html>
