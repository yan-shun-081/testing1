<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YAN1 Python Runner</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0b0b12;
            color: white;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .connection {
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .connected {
            color: #39e58c;
        }

        .disconnected {
            color: #ff5c5c;
        }

        .not-installed {
            color: #ffb84d;
        }

        .box {
            background: #15151f;
            border: 1px solid #2c2c3a;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            min-height: 280px;
            resize: vertical;
            border: 1px solid #383849;
            border-radius: 10px;
            background: #090910;
            color: #f5f5f5;
            padding: 15px;
            font-family: Consolas, monospace;
            font-size: 15px;
            line-height: 1.5;
            outline: none;
        }

        textarea:focus {
            border-color: #6c63ff;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #6c63ff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #574fff;
        }

        button:disabled {
            background: #3a3948;
            cursor: not-allowed;
        }

        .output {
            background: #090910;
            border: 1px solid #383849;
            border-radius: 10px;
            padding: 15px;
            min-height: 150px;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: Consolas, monospace;
            font-size: 14px;
            line-height: 1.5;
            overflow-x: auto;
        }

        .waiting {
            color: #888;
        }

        .error {
            color: #ff6b6b;
        }

        .success {
            color: #65e6a1;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>YAN1 Python Runner</h1>

    <div id="connectionStatus"
         class="connection disconnected">
        Checking YAN1 App...
    </div>

    <div class="box">

        <label for="pythonCode">
            Enter Python Code
        </label>

        <textarea
            id="pythonCode"
            spellcheck="false"
            placeholder="print('Hello from YAN1!')"></textarea>

        <button
            id="sendButton"
            onclick="sendPythonCode()">
            Send Python Code
        </button>

    </div>

    <div class="box">

        <label>
            Python Output
        </label>

        <div id="output"
             class="output waiting">
            Waiting for Python execution...
        </div>

    </div>

</div>

<script>

/* ============================================================
   YAN1 APP DETECTION
   ============================================================ */

function isYAN1App() {

    return (
        window.AndroidPython &&
        typeof window.AndroidPython.executePython === "function"
    );
}


/* ============================================================
   CONNECTION STATUS
   ============================================================ */

let appConnected = false;

function checkYAN1Connection() {

    const status =
        document.getElementById("connectionStatus");

    if (isYAN1App()) {

        appConnected = true;

        status.textContent =
            "● Connected to YAN1 App";

        status.className =
            "connection connected";

    } else {

        appConnected = false;

        status.textContent =
            "● Checking for YAN1 App...";

        status.className =
            "connection disconnected";
    }
}


/* ============================================================
   OPEN CURRENT WEBSITE IN YAN1 APP
   ============================================================

   IMPORTANT:

   There is NO hardcoded website URL here.

   window.location.href automatically gives the
   CURRENT page URL.

   Example:

   If the user is currently on:
   https://example.com/page1

   that exact URL is sent to the Android app.

   If the user is already inside YAN1 App:
       NOTHING happens.

   ============================================================ */

function openCurrentPageInYAN1App() {

    /* Already inside the app */
    if (isYAN1App()) {

        console.log(
            "Already running inside YAN1 App."
        );

        return;
    }


    /*
     * Get the current page URL dynamically.
     *
     * No website URL is hardcoded.
     */

    const currentPageURL =
        window.location.href;


    /*
     * Android intent URI.
     *
     * The current URL is passed to Android.
     */

    const intentURL =
        "intent:" +
        currentPageURL +
        "#Intent;" +
        "scheme=https;" +
        "package=com.example1.yan1appgen1;" +
        "end";


    /*
     * Remember that we attempted to open
     * the Android app.
     */

    sessionStorage.setItem(
        "yan1_app_open_attempted",
        "true"
    );


    /*
     * Try opening YAN1 App.
     */

    window.location.href = intentURL;


    /*
     * If Android does not launch the app,
     * the browser remains available.
     *
     * After a short delay we show the
     * "App not installed" message.
     */

    setTimeout(function() {

        if (!isYAN1App()) {

            showAppNotInstalledMessage();

        }

    }, 1800);
}


/* ============================================================
   APP NOT INSTALLED MESSAGE
   ============================================================ */

function showAppNotInstalledMessage() {

    if (isYAN1App()) {
        return;
    }

    const status =
        document.getElementById("connectionStatus");

    status.textContent =
        "● YAN1 App is not installed";

    status.className =
        "connection not-installed";
}


/* ============================================================
   PYTHON EXECUTION
   ============================================================ */

function runPythonOnDevice(
    pythonCode,
    onSuccess,
    onError
) {

    if (!isYAN1App()) {

        const errorMessage =
            "Execution failed:\n\n" +
            "YAN1 Android App is not connected.\n" +
            "Please open this page inside the YAN1 App.";

        console.error(errorMessage);

        if (onError) {
            onError(errorMessage);
        }

        return;
    }


    /*
     * Unique request ID.
     */

    const requestId =
        "py_req_" +
        Date.now() +
        "_" +
        Math.floor(Math.random() * 100000);


    /*
     * Success callback.
     */

    window[requestId + "_success"] =
        function(output) {

            if (onSuccess) {
                onSuccess(output);
            }

            cleanupTrackers(requestId);
        };


    /*
     * Error callback.
     */

    window[requestId + "_error"] =
        function(errorLog) {

            if (onError) {
                onError(errorLog);
            }

            cleanupTrackers(requestId);
        };


    /*
     * Send Python code to Android.
     */

    try {

        window.AndroidPython.executePython(
            pythonCode,
            requestId
        );

    } catch (error) {

        window[requestId + "_error"](
            error.toString()
        );
    }
}


/* ============================================================
   CLEAN CALLBACKS
   ============================================================ */

function cleanupTrackers(id) {

    delete window[id + "_success"];
    delete window[id + "_error"];
}


/* ============================================================
   PYTHON SUCCESS ROUTER
   ============================================================ */

window.onPythonResult =
    function(output, callbackId) {

        const handler =
            window[callbackId + "_success"];

        if (handler) {

            handler(output);

        } else {

            console.log(
                "Python Output:",
                output
            );
        }
    };


/* ============================================================
   PYTHON ERROR ROUTER
   ============================================================ */

window.onPythonError =
    function(errorMessage, callbackId) {

        const handler =
            window[callbackId + "_error"];

        if (handler) {

            handler(errorMessage);

        } else {

            console.error(
                "Python Error:",
                errorMessage
            );
        }
    };


/* ============================================================
   SEND PYTHON CODE
   ============================================================ */

function sendPythonCode() {

    const codeBox =
        document.getElementById("pythonCode");

    const outputBox =
        document.getElementById("output");

    const sendButton =
        document.getElementById("sendButton");


    const pythonCode =
        codeBox.value.trim();


    /* Empty code */

    if (!pythonCode) {

        outputBox.className =
            "output error";

        outputBox.textContent =
            "Please enter Python code first.";

        return;
    }


    /* Check app */

    if (!isYAN1App()) {

        outputBox.className =
            "output error";

        outputBox.textContent =
            "YAN1 Android App is not connected.\n\n" +
            "Please open this page inside the YAN1 App.";

        checkYAN1Connection();

        return;
    }


    /* Disable button */

    sendButton.disabled = true;

    sendButton.textContent =
        "Running...";


    outputBox.className =
        "output waiting";

    outputBox.textContent =
        "Executing Python code...";


    /* Execute */

    runPythonOnDevice(

        pythonCode,


        /* SUCCESS */

        function(output) {

            outputBox.className =
                "output success";


            if (
                output === undefined ||
                output === null ||
                output === ""
            ) {

                outputBox.textContent =
                    "Python executed successfully.\n" +
                    "No output was returned.";

            } else {

                outputBox.textContent =
                    String(output);
            }


            sendButton.disabled = false;

            sendButton.textContent =
                "Send Python Code";
        },


        /* ERROR */

        function(errorLog) {

            outputBox.className =
                "output error";

            outputBox.textContent =
                String(errorLog);


            sendButton.disabled = false;

            sendButton.textContent =
                "Send Python Code";
        }
    );
}


/* ============================================================
   CTRL + ENTER
   ============================================================ */

document
    .getElementById("pythonCode")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.ctrlKey &&
                event.key === "Enter"
            ) {

                event.preventDefault();

                sendPythonCode();
            }
        }
    );


/* ============================================================
   INITIAL CONNECTION CHECK
   ============================================================ */

checkYAN1Connection();


/* ============================================================
   WAIT FOR ANDROID BRIDGE
   ============================================================ */

setTimeout(
    checkYAN1Connection,
    300
);

setTimeout(
    checkYAN1Connection,
    1000
);

setTimeout(
    checkYAN1Connection,
    2000
);


/* ============================================================
   AUTO OPEN APP
   ============================================================

   If already inside app:
       NOTHING.

   If in Chrome:
       Attempt to open the CURRENT page
       inside YAN1 App.

   ============================================================ */

setTimeout(
    function() {

        /*
         * Already inside app.
         */

        if (isYAN1App()) {

            console.log(
                "YAN1 App detected. No redirect."
            );

            return;
        }


        /*
         * Don't repeatedly attempt the
         * app launch during this session.
         */

        if (
            sessionStorage.getItem(
                "yan1_app_open_attempted"
            ) === "true"
        ) {

            showAppNotInstalledMessage();

            return;
        }


        /*
         * Try to open the current page
         * in YAN1 App.
         */

        openCurrentPageInYAN1App();

    },
    1200
);


/* ============================================================
   PERIODIC CONNECTION CHECK
   ============================================================ */

setInterval(
    function() {

        checkYAN1Connection();

    },
    3000
);

</script>

</body>

</html>
