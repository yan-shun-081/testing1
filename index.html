<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python Runner</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    textarea {
      width: 100%;
      min-height: 300px;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #111827;
      color: #e2e8f0;
      font-size: 16px;
      resize: vertical;
    }
    button {
      margin-top: 16px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    .output-box {
      margin-top: 20px;
      background: #111827;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      white-space: pre-wrap;
      min-height: 120px;
      color: #d1fae5;
    }
    .label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Python Runner</h1>

    <label class="label" for="code">Paste Python code</label>
    <textarea id="code">print("Hello from Python!")
x = 2 + 3
print("Result:", x)
</textarea>

    <button id="runBtn">Send to App</button>

    <h3>Output</h3>
    <div id="output" class="output-box">Waiting for result...</div>
  </div>

  <script>
    const runBtn = document.getElementById("runBtn");
    const codeInput = document.getElementById("code");
    const outputBox = document.getElementById("output");

    runBtn.addEventListener("click", function () {
      const code = codeInput.value;

      if (!code.trim()) {
        outputBox.textContent = "Please enter Python code.";
        return;
      }

      try {
        outputBox.textContent = "Running...";
        const result = window.Android.runPython(code);
        outputBox.textContent = result || "No output";
      } catch (error) {
        outputBox.textContent = "Error: " + error.message;
      }
    });
  </script>
</body>
</html>
