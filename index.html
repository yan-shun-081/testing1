<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YAN1 Python Runner</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0b0b12;
            color: white;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .connection {
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .connected {
            color: #39e58c;
        }

        .disconnected {
            color: #ff5c5c;
        }

        .box {
            background: #15151f;
            border: 1px solid #2c2c3a;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            min-height: 280px;
            resize: vertical;
            border: 1px solid #383849;
            border-radius: 10px;
            background: #090910;
            color: #f5f5f5;
            padding: 15px;
            font-family: Consolas, monospace;
            font-size: 15px;
            line-height: 1.5;
            outline: none;
        }

        textarea:focus {
            border-color: #6c63ff;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #6c63ff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #574fff;
        }

        button:disabled {
            background: #3a3948;
            cursor: not-allowed;
        }

        .output {
            background: #090910;
            border: 1px solid #383849;
            border-radius: 10px;
            padding: 15px;
            min-height: 150px;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: Consolas, monospace;
            font-size: 14px;
            line-height: 1.5;
            overflow-x: auto;
        }

        .waiting {
            color: #888;
        }

        .error {
            color: #ff6b6b;
        }

        .success {
            color: #65e6a1;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>YAN1 Python Runner</h1>

        <div id="connectionStatus" class="connection disconnected">
            Connecting to YAN1 App...
        </div>

        <div class="box">

            <label for="pythonCode">
                Enter Python Code
            </label>

            <textarea id="pythonCode" spellcheck="false"
                placeholder="print('Hello from YAN1!')"></textarea>

            <button id="sendButton" onclick="sendPythonCode()">
                Send Python Code
            </button>

        </div>

        <div class="box">

            <label>
                Python Output
            </label>

            <div id="output" class="output waiting">
                Waiting for Python execution...
            </div>

        </div>

    </div>


    <script>

        /*
         * ============================================================
         * YAN1 PYTHON CONNECTION
         * ============================================================
         *
         * The Android app must provide:
         *
         * window.AndroidPython.executePython(pythonCode, requestId)
         *
         * The Android app must call:
         *
         * window.onPythonResult(output, requestId)
         *
         * or:
         *
         * window.onPythonError(errorMessage, requestId)
         *
         */


        let appConnected = false;


        /*
         * ------------------------------------------------------------
         * CHECK CONNECTION
         * ------------------------------------------------------------
         *
         * The page automatically checks whether it is running
         * inside the YAN1 Android app.
         */

        function checkYAN1Connection() {

            const status = document.getElementById("connectionStatus");

            if (window.AndroidPython &&
                typeof window.AndroidPython.executePython === "function") {

                appConnected = true;

                status.textContent = "● Connected to YAN1 App";
                status.className = "connection connected";

            } else {

                appConnected = false;

                status.textContent =
                    "● Not connected — Open this page inside YAN1 App";

                status.className = "connection disconnected";
            }
        }


        /*
         * ------------------------------------------------------------
         * RUN PYTHON ON DEVICE
         * ------------------------------------------------------------
         */

        function runPythonOnDevice(pythonCode, onSuccess, onError) {

            // Check Android bridge

            if (!window.AndroidPython ||
                typeof window.AndroidPython.executePython !== "function") {

                const fallbackMsg =
                    "Execution failed: Not running inside the YAN1 APP environment.";

                console.error(fallbackMsg);

                if (onError) {
                    onError(fallbackMsg);
                }

                return;
            }


            /*
             * Create unique ID for this execution.
             */

            const requestId =
                "py_req_" +
                Date.now() +
                "_" +
                Math.floor(Math.random() * 1000);


            /*
             * Create temporary success callback.
             */

            window[requestId + "_success"] = function (output) {

                if (onSuccess) {
                    onSuccess(output);
                }

                cleanupTrackers(requestId);
            };


            /*
             * Create temporary error callback.
             */

            window[requestId + "_error"] = function (errorLog) {

                if (onError) {
                    onError(errorLog);
                }

                cleanupTrackers(requestId);
            };


            /*
             * Send Python code to Android.
             */

            try {

                window.AndroidPython.executePython(
                    pythonCode,
                    requestId
                );

            } catch (error) {

                window[requestId + "_error"](
                    error.toString()
                );
            }
        }


        /*
         * ------------------------------------------------------------
         * CLEAN TEMPORARY CALLBACKS
         * ------------------------------------------------------------
         */

        function cleanupTrackers(id) {

            delete window[id + "_success"];
            delete window[id + "_error"];
        }


        /*
         * ------------------------------------------------------------
         * PYTHON SUCCESS ROUTER
         * ------------------------------------------------------------
         *
         * Android should call:
         *
         * window.onPythonResult(output, requestId)
         */

        window.onPythonResult = function (output, callbackId) {

            const specificSuccessHandler =
                window[callbackId + "_success"];


            if (specificSuccessHandler) {

                specificSuccessHandler(output);

            } else {

                console.log(
                    "Global Catch - Python Output:",
                    output
                );
            }
        };


        /*
         * ------------------------------------------------------------
         * PYTHON ERROR ROUTER
         * ------------------------------------------------------------
         *
         * Android should call:
         *
         * window.onPythonError(errorMessage, requestId)
         */

        window.onPythonError = function (errorMessage, callbackId) {

            const specificErrorHandler =
                window[callbackId + "_error"];


            if (specificErrorHandler) {

                specificErrorHandler(errorMessage);

            } else {

                console.error(
                    "Global Catch - Python Error:",
                    errorMessage
                );
            }
        };


        /*
         * ------------------------------------------------------------
         * SEND BUTTON
         * ------------------------------------------------------------
         */

        function sendPythonCode() {

            const codeBox =
                document.getElementById("pythonCode");

            const outputBox =
                document.getElementById("output");

            const sendButton =
                document.getElementById("sendButton");


            const pythonCode =
                codeBox.value.trim();


            /*
             * Don't allow empty code.
             */

            if (!pythonCode) {

                outputBox.className = "output error";

                outputBox.textContent =
                    "Please enter Python code first.";

                return;
            }


            /*
             * Check Android connection.
             */

            if (!window.AndroidPython ||
                typeof window.AndroidPython.executePython !== "function") {

                outputBox.className = "output error";

                outputBox.textContent =
                    "YAN1 Android App is not connected.\n\n" +
                    "Please open this page inside the YAN1 App.";

                checkYAN1Connection();

                return;
            }


            /*
             * Disable button while executing.
             */

            sendButton.disabled = true;
            sendButton.textContent = "Running...";


            outputBox.className = "output waiting";

            outputBox.textContent =
                "Executing Python code...";


            /*
             * Send code to Android.
             */

            runPythonOnDevice(

                pythonCode,

                function (output) {

                    /*
                     * SUCCESS
                     */

                    outputBox.className = "output success";

                    if (output === undefined ||
                        output === null ||
                        output === "") {

                        outputBox.textContent =
                            "Python executed successfully.\n" +
                            "No output was returned.";

                    } else {

                        outputBox.textContent =
                            String(output);
                    }


                    sendButton.disabled = false;
                    sendButton.textContent =
                        "Send Python Code";
                },


                function (errorLog) {

                    /*
                     * ERROR
                     */

                    outputBox.className = "output error";

                    outputBox.textContent =
                        String(errorLog);


                    sendButton.disabled = false;
                    sendButton.textContent =
                        "Send Python Code";
                }
            );
        }


        /*
         * ------------------------------------------------------------
         * ENTER KEY
         * ------------------------------------------------------------
         *
         * Ctrl + Enter / Android keyboard equivalent can send code.
         */

        document
            .getElementById("pythonCode")
            .addEventListener("keydown", function (event) {

                if (event.ctrlKey && event.key === "Enter") {

                    event.preventDefault();

                    sendPythonCode();
                }
            });


        /*
         * ------------------------------------------------------------
         * AUTOMATIC CONNECTION CHECK
         * ------------------------------------------------------------
         *
         * Check immediately and again shortly afterward because
         * Android's JavaScript bridge may become available after
         * the webpage initially loads.
         */

        checkYAN1Connection();


        setTimeout(function () {
            checkYAN1Connection();
        }, 500);


        setTimeout(function () {
            checkYAN1Connection();
        }, 1500);


        setInterval(function () {
            checkYAN1Connection();
        }, 3000);


    </script>

</body>

</html>
