<!DOCTYPE html>
<html>
<head>
    <title>YAN1 Remote Python</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; padding: 20px; }
        textarea { width: 100%; height: 200px; background: #000; color: #fff; border: 1px solid #333; }
        button { padding: 10px; background: #222; color: #fff; cursor: pointer; border: 1px solid #444; }
        button:disabled { color: #555; }
        #log { background: #000; padding: 10px; border: 1px solid #222; margin-top: 20px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Remote Phone Engine</h1>
    <div id="status">Connecting to Phone...</div>
    <textarea id="code">print("Hello from the Web!")
import requests
print(f"Phone Public IP: {requests.get('https://api.ipify.org').text}")
    </textarea><br>
    <button id="runBtn" onclick="run()" disabled>Connect First</button>
    <div id="log">Logs will appear here...</div>

    <script>
        const peer = new Peer();
        let conn;
        const TARGET_ID = 'yan1-app-remote-engine';

        peer.on('open', () => {
            console.log('Connecting to: ' + TARGET_ID);
            conn = peer.connect(TARGET_ID);
            
            conn.on('open', () => {
                document.getElementById('status').innerText = "ONLINE: Connected to Phone";
                document.getElementById('runBtn').disabled = false;
                document.getElementById('runBtn').innerText = "Execute on Phone";
            });

            conn.on('data', (data) => {
                const res = JSON.parse(data);
                document.getElementById('log').innerText += "\n[Result] " + res.output;
            });
        });

        function run() {
            const code = document.getElementById('code').value;
            conn.send(JSON.stringify({ id: Date.now().toString(), code: code }));
            document.getElementById('log').innerText += "\n[Sent] Code sent to phone...";
        }
    </script>
</body>
</html>
