<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qwen Offline AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 900px;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    h2 {
      margin: 0 0 16px;
      font-size: 24px;
      color: #f9fafb;
    }
    .status {
      font-size: 14px;
      margin-bottom: 12px;
      color: #93c5fd;
      min-height: 20px;
    }
    textarea {
      width: 100%;
      min-height: 150px;
      border-radius: 12px;
      border: 1px solid #4b5563;
      background: #0b1220;
      color: white;
      padding: 14px;
      font-size: 16px;
      resize: vertical;
    }
    .row {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
    }
    button.secondary {
      background: #374151;
    }
    .output {
      margin-top: 20px;
      background: #0b1220;
      border: 1px solid #374151;
      border-radius: 12px;
      min-height: 180px;
      padding: 16px;
      white-space: pre-wrap;
      line-height: 1.6;
      color: #e5e7eb;
    }
    .loading {
      color: #fbbf24;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Offline AI</h2>

    <div class="status" id="status">Checking app connection...</div>

    <textarea id="question" placeholder="Type your question here...">What is artificial intelligence in simple words?</textarea>

    <div class="row">
      <button id="sendBtn">Send</button>
      <button id="clearBtn" class="secondary">Clear</button>
    </div>

    <div class="output" id="output">Answer will appear here...</div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const outputEl = document.getElementById("output");
    const questionEl = document.getElementById("question");

    function appReady() {
      return !!(window.Qwen && typeof window.Qwen.ask === "function");
    }

    function updateStatus(text, isWarning = false) {
      statusEl.textContent = text;
      statusEl.style.color = isWarning ? "#fbbf24" : "#93c5fd";
    }

    function setLoading(value) {
      if (value) {
        outputEl.classList.add("loading");
        outputEl.textContent = "Thinking...";
      } else {
        outputEl.classList.remove("loading");
      }
    }

    function askAI(prompt) {
      if (!prompt || !prompt.trim()) {
        outputEl.textContent = "Please enter a question first.";
        return;
      }

      setLoading(true);

      try {
        if (appReady()) {
          updateStatus("Connected to app AI bridge");
          const result = window.Qwen.ask(prompt.trim());
          outputEl.textContent = result;
        } else {
          updateStatus("Open this page inside the Android app WebView", true);
          outputEl.textContent = "This page must be opened inside the Android app. The AI bridge is not available in a normal browser.";
        }
      } catch (e) {
        outputEl.textContent = "Error: " + (e && e.message ? e.message : String(e));
      } finally {
        setLoading(false);
      }
    }

    document.getElementById("sendBtn").addEventListener("click", function () {
      askAI(questionEl.value);
    });

    document.getElementById("clearBtn").addEventListener("click", function () {
      questionEl.value = "";
      outputEl.textContent = "Answer will appear here...";
      updateStatus("Ready");
    });

    questionEl.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
        askAI(questionEl.value);
      }
    });

    if (appReady()) {
      updateStatus("App bridge ready");
    } else {
      updateStatus("Open this page inside the Android app WebView", true);
    }
  </script>
</body>
</html>
