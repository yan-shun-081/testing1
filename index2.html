<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YAN1 AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 100%;
            max-width: 900px;
            height: 100vh;
            margin: auto;
            padding: 20px;

            display: flex;
            flex-direction: column;
        }

        h1 {
            margin: 0 0 15px;
            text-align: center;
            font-size: 28px;
            color: #111;
        }

        .chat-container {
            flex: 1;
            width: 100%;
            min-height: 0;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .open-ai {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 80%;
            max-width: 500px;
            height: 100px;

            text-decoration: none;
            font-size: 28px;
            font-weight: bold;

            color: white;
            background: #111;

            border-radius: 15px;

            transition: 0.2s;
        }

        .open-ai:hover {
            background: #333;
            transform: scale(1.02);
        }

        .open-ai:active {
            transform: scale(0.98);
        }

        @media (max-width: 600px) {

            .container {
                padding: 0;
            }

            h1 {
                padding: 15px;
                margin: 0;
                font-size: 22px;
            }

            .chat-container {
                border-radius: 0;
            }

            .open-ai {
                width: 85%;
                height: 80px;
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>YAN1 AI</h1>

        <div class="chat-container">

            <a
                href="https://chat.ragmyai.com/1aceee93-192a-4d2f-8741-71af6a7f9437"
                target="_blank"
                rel="noopener noreferrer"
                class="open-ai">
                OPEN YAN1 AI
            </a>

        </div>

    </div>

</body>

</html>
