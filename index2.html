<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YAN1 Offline AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 1100px;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h2 { margin: 0 0 8px; font-size: 28px; color: #f9fafb; }
    .status {
      font-size: 14px;
      margin-bottom: 20px;
      color: #93c5fd;
      background: rgba(37, 99, 235, 0.1);
      padding: 8px 12px;
      border-radius: 8px;
      display: inline-block;
    }
    .main-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 24px;
    }
    .left-panel, .right-panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
    }
    textarea {
      width: 100%;
      min-height: 120px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      padding: 14px;
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
    }
    textarea:focus { border-color: #3b82f6; }
    .row { display: flex; gap: 12px; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button.secondary { background: #475569; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .output {
      margin-top: 20px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      min-height: 200px;
      padding: 16px;
      white-space: pre-wrap;
      line-height: 1.6;
      color: #cbd5e1;
    }
    .loading { color: #fbbf24; font-style: italic; }

    .log-box h3 { margin: 0 0 12px; font-size: 18px; }
    .grid {
      display: grid;
      grid-template-columns: 80px 1fr 1fr;
      gap: 2px;
      background: #334155;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
    }
    .grid-header { background: #0f172a; padding: 10px; font-weight: bold; font-size: 13px; }
    .grid-cell { background: #1e293b; padding: 10px; font-size: 13px; word-break: break-word; }
    .tag { padding: 2px 6px; border-radius: 4px; font-size: 11px; text-transform: uppercase; font-weight: bold; }
    .tag-sys { background: #d97706; }
    .tag-web { background: #2563eb; }
    .tag-app { background: #059669; }

    @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <h2>YAN1 Offline AI</h2>
    <div class="status" id="status">Connecting to Bridge...</div>

    <div class="main-grid">
      <div class="left-panel">
        <textarea id="question" placeholder="Ask anything...">What are the benefits of local AI?</textarea>
        <div class="row">
          <button id="sendBtn">Send Message</button>
          <button id="clearBtn" class="secondary">Clear</button>
        </div>
        <div class="output" id="output">AI output will appear here...</div>
      </div>

      <div class="right-panel">
        <div class="log-box">
          <h3>Activity Log</h3>
          <div class="grid" id="logGrid">
            <div class="grid-header">Source</div>
            <div class="grid-header">Action</div>
            <div class="grid-header">Status</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const outputEl = document.getElementById("output");
    const questionEl = document.getElementById("question");
    const logGrid = document.getElementById("logGrid");
    const sendBtn = document.getElementById("sendBtn");

    // Pre-load handler for the app's initialization ping
    window.__qwen_preload_callback = function(res) {
        addLog("app", "App Pre-load", "Model Ready in Background");
        updateStatus("AI Model Ready (Pre-loaded)");
    };

    function addLog(type, action, status) {
      const row = `
        <div class="grid-cell"><span class="tag tag-${type.slice(0,3)}">${type}</span></div>
        <div class="grid-cell">${action}</div>
        <div class="grid-cell">${status}</div>
      `;
      logGrid.insertAdjacentHTML('beforeend', row);
    }

    function updateStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.style.color = isError ? "#f87171" : "#93c5fd";
    }

    function checkBridge() {
      if (window.Qwen) return "Qwen";
      if (window.Android) return "Python";
      return null;
    }

    async function askAI() {
      const prompt = questionEl.value.trim();
      if (!prompt) return;

      const bridge = checkBridge();
      if (!bridge) {
        updateStatus("Error: Run this inside the YAN1 App", true);
        return;
      }

      sendBtn.disabled = true;
      outputEl.innerHTML = '<span class="loading">Generating response (this may take a few seconds)...</span>';
      addLog("web", "Request Sent", "Waiting for AI...");

      try {
        if (bridge === "Qwen") {
          // Unique callback for this request
          const cbName = "cb_" + Date.now();
          window[cbName] = function(answer) {
            outputEl.textContent = answer;
            addLog("app", "Response Received", "Success");
            sendBtn.disabled = false;
            delete window[cbName];
          };
          window.Qwen.askAsync(prompt, cbName);
        } else {
          // Fallback to Python bridge if Qwen isn't loaded
          const result = window.Android.runPython(prompt);
          outputEl.textContent = result;
          sendBtn.disabled = false;
        }
      } catch (e) {
        outputEl.textContent = "Bridge Error: " + e.message;
        sendBtn.disabled = false;
        addLog("sys", "Bridge Failed", e.message);
      }
    }

    // Initialize UI
    const bridgeType = checkBridge();
    if (bridgeType === "Qwen") {
        const info = window.Qwen.getStatus ? window.Qwen.getStatus() : "Connected";
        updateStatus("Connected: " + info);
        addLog("sys", "Bridge Link", "Qwen Native OK");
    } else if (bridgeType === "Python") {
        updateStatus("Connected: Python Bridge");
        addLog("sys", "Bridge Link", "Android Bridge OK");
    } else {
        updateStatus("Not Connected (Open in App)", true);
    }

    sendBtn.addEventListener("click", askAI);
    document.getElementById("clearBtn").addEventListener("click", () => {
      questionEl.value = "";
      outputEl.textContent = "AI output will appear here...";
    });
  </script>
</body>
</html>
